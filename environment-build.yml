# Conda environment for producing the Windows .exe -- environment.yml plus the
# packaging tools, kept separate so the everyday runtime environment does not
# carry a build toolchain it never uses.
#
# Same pins as environment.yml on purpose: the executable ships whatever versions
# are resolved here, so a build environment that drifted from the runtime one
# would mean testing against different libraries than the users get.
#
# Created and used by Build.bat; nothing here comes from pip.
name: mapmaker-build
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.13
  - contextily 1.7.1
  - geopandas 1.1.3
  - matplotlib-base 3.11.0
  - numpy 2.5.2
  - pandas 3.0.5
  - pillow 12.3.0
  - pyproj 3.7.2
  - openpyxl 3.1.5
  - shapely 2.1.2
  # The packaging tools themselves, from conda-forge like everything else.
  # pyinstaller-hooks-contrib carries the maintained hooks for third-party
  # packages (matplotlib, geopandas, pyproj, certifi and friends); the few
  # packages it has no hook for are covered by packaging/hooks/.
  - pyinstaller >=6.11
  - pyinstaller-hooks-contrib
