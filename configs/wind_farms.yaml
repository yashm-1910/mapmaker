base: default.yaml
map_type: wind_farms

export:
  filename: "wind_farm_locations.png"

# For this dataset the SE/NE corners hold real farms (Hornsea Point, Nordsee
# Alpha/Beta), so the (opaque) inset overview goes NW instead, where nothing
# is plotted; the north arrow default (SE) is already clear of data.
# Set inset_map.show: false to turn the inset off entirely (same pattern as
# basemap.show / legend.show / scalebar.show / north_arrow.show / footer.show).
inset_map:
  show: true
  location: "upper left"

style:
  marker: "o"           # any matplotlib marker code, e.g. "o" circle, "D" diamond, "^" triangle
  color: "#2166ac"       # used for every farm unless the data has a `status` column (see below)
  size_field: capacity_mw   # optional column; omit/rename freely -- markers fall back to a fixed size
  base_marker_size: 45
  size_scale: 0.5
  label_points: true
  # Optional: only takes effect if wind_farms.xlsx has a `status` column (name/lon/lat
  # alone are enough to plot a wind farm -- status, country, capacity are all optional).
  # status_colors:
  #   Operational: "#2ca25f"
  #   Under Construction: "#fdae61"
  #   Planned: "#3182bd"
