# Base configuration shared by all maps. Specific configs set `base: default.yaml`
# and only need to override what differs. Every option below has a sane default
# even if omitted entirely -- see mapmaker/config.py DEFAULTS.
#
# `title` / `subtitle` are intentionally absent here: if a config doesn't set
# them, no title is drawn at all (see mapmaker/render.py _add_title).

author: "Yash Mahajan"
date: auto                     # "auto" -> today's date, or an explicit "2026-08-28"

attribution:
  text: "© OpenStreetMap (OSM)"

company:
  name: "DNV Energy Systems Germany GmbH"
  logo_path: "../assets/logo.png"   # relative to this config file's directory

map:
  crs: "EPSG:4326"              # coordinate reference system for plotting + basemap
  figsize: [13, 8]              # inches; landscape. The map panel's own aspect ratio
                                 # drives how the data extent is padded (see render.py
                                 # _compute_extent) so there's no wasted white margin.
  dpi: 300
  background_color: "white"
  padding_fraction: 0.12        # extra breathing room around the data extent
  extent: null                  # e.g. [minlon, maxlon, minlat, maxlat] to override auto extent

basemap:
  show: true
  # tile.openstreetmap.org requires a descriptive User-Agent (see `headers`) or it
  # silently serves a "blocked" placeholder tile instead of erroring out.
  # Alternatives: "CartoDB.Positron" or "Esri.WorldGrayCanvas" for a more muted look.
  provider: "OpenStreetMap.Mapnik"
  zoom: auto
  alpha: 1.0
  headers:
    User-Agent: "mapmaker/1.0"

graticule:
  show: true
  n_ticks: 5                    # approx. number of cross-tick gridlines per axis
  format: decimal                # decimal | dms
  fontsize: 10
  color: "0.35"
  linewidth: 0.6
  frame: true

# Rendered in its own footer panel below the map -- never overlaps map content.
legend:
  show: true
  title: "Legend"

# Rendered in its own footer panel, sized from the map's true printed scale.
scalebar:
  show: true
  units: auto            # auto | m | km
  length_fraction: 0.55  # target fraction of the scale-bar panel's width

north_arrow:
  show: true
  location: "lower right"   # compass rose, drawn inside the map frame
  size: 0.045

inset_map:
  show: true
  location: "lower left"    # overview map with a red ROI bounding box, inside the frame
  size: 0.28
  zoom_out_factor: 8
  bbox_edgecolor: "red"
  bbox_linewidth: 2.2
  min_bbox_frac: 0.05        # ROI box floored to this fraction of the inset's width/height,
                              # so it stays visible even at a large zoom_out_factor

footer:
  show: true
  height_fraction: 0.09           # keep the footer band close to the bottom border
  column_widths: [1.0, 1.3, 1.4, 2.1]  # legend | scale bar | CRS | date-author-copyright+logo
  fontsize: 8
  text_color: "0.15"

export:
  output_dir: "../output"
  transparent: false

data:
  wind_farms_file: "../data/wind_farms.xlsx"
  turbines_file: "../data/turbines.xlsx"
  grid_cells_file: "../data/grid_cells.xlsx"
