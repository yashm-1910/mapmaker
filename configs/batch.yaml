# Batch run: each job loads a config file and applies its own overrides on top.
jobs:
  - name: "Wind farm overview"
    config: wind_farms.yaml

  - name: "Turbines - all farms"
    config: turbines.yaml
    # No data.selected_farm override: turbines.xlsx has 3 farms, so this one job
    # renders 3 PNGs (turbines_nordsee_alpha.png, turbines_gemini_reef.png,
    # turbines_borssele_wind.png) automatically -- see render.py::build_turbine_map.

  - name: "ERA5 vs MERRA2 grid"
    config: grid_cells.yaml
