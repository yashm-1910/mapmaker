base: default.yaml
map_type: grid_cells

export:
  filename: "era5_merra2_grid_cells.png"

map:
  padding_fraction: 0.05

inset_map:
  zoom_out_factor: 4
  size: 0.22

north_arrow:
  size: 0.035

style:
  marker: "D"            # any matplotlib marker code, e.g. "D" diamond, "o" circle, "^" triangle
  dataset_colors:
    ERA5: "#3182bd"
    MERRA2: "#e6550d"
  marker_size: 14

graticule:
  n_ticks: 6

# Optional: the wind farm this ERA5/MERRA2 comparison is centered on, shown as a single
# circle point with its name. Coordinates come from here (config), not from
# grid_cells.xlsx, since it's one reference point rather than part of the grid.
reference_point:
  show: true
  name: "Nordsee Alpha"
  lon: 6.35
  lat: 54.65
