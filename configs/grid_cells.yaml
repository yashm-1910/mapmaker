base: default.yaml
map_type: grid_cells

export:
  filename: "era5_merra2_grid_cells.png"

map:
  padding_fraction: 0.05

inset_map:
  zoom_out_factor: 4
  size: 0.22

north_arrow:
  size: 0.035

style:
