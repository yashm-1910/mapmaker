{% set version = "0.1.0" %}

package:
  name: mapmaker
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  entry_points:
    - mapmaker = mapmaker.cli:main
    - mapmaker-gui = mapmaker.gui:main

requirements:
  host:
    - python >=3.13
    - pip
    - setuptools >=68
  run:
    - python >=3.13
    - contextily 1.7.1
    - geopandas 1.1.3
    - matplotlib-base 3.11.0
    - numpy 2.5.2
    - pandas 3.0.5
    - pillow 12.3.0
    - pyproj 3.7.2
    - openpyxl 3.1.5
    - shapely 2.1.2

test:
  imports:
    - mapmaker
  commands:
    - mapmaker --help

about:
  summary: QGIS print-layout-style map generator for wind energy datasets, driven by a single Excel workbook.